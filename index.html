<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard CD Guarapari</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(135deg,#eaf1ff,#f8fafc);
    min-height:100vh;
    padding:30px;
}

h1{
    text-align:center;
    font-size:42px;
    color:#0f172a;
    margin-bottom:30px;
    font-weight:800;
}

.upload{
    max-width:800px;
    margin:0 auto 30px;
    background:white;
    padding:30px;
    border-radius:24px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
    text-align:center;
}

.upload h3{
    margin-bottom:15px;
    color:#334155;
}

input[type=file]{
    width:100%;
    max-width:450px;
    padding:14px;
    border:2px dashed #2563eb;
    border-radius:14px;
    cursor:pointer;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:20px;
    max-width:1600px;
    margin:auto;
}

.card{
    background:white;
    border-radius:24px;
    padding:28px;
    box-shadow:0 10px 25px rgba(0,0,0,.08);
    transition:.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.card h2{
    margin-bottom:15px;
    color:#0f172a;
}

.card p{
    margin:10px 0;
    color:#475569;
}

.numero,
.porcentagem{
    font-size:56px;
    font-weight:800;
}

.total{
    background:linear-gradient(135deg,#2563eb,#3b82f6);
    color:white;
}

.total h2,
.total .numero{
    color:white;
}

.ocupadas{
    background:linear-gradient(135deg,#dc2626,#ef4444);
    color:white;
}

.ocupadas h2,
.ocupadas .numero{
    color:white;
}

.livres{
    background:linear-gradient(135deg,#16a34a,#22c55e);
    color:white;
}

.livres h2,
.livres .numero{
    color:white;
}

.taxa{
    background:linear-gradient(135deg,#f59e0b,#fbbf24);
    color:white;
}

.taxa h2,
.taxa .porcentagem{
    color:white;
}

.acoes{
    text-align:center;
    margin-top:30px;
}

.btn{
    border:none;
    border-radius:14px;
    padding:15px 28px;
    margin:5px;
    cursor:pointer;
    color:white;
    font-weight:700;
    font-size:15px;
    transition:.3s;
}

.btn:hover{
    transform:translateY(-2px);
}

.png{
    background:#2563eb;
}

.whatsapp{
    background:#25D366;
}

@media(max-width:768px){
    h1{
        font-size:30px;
    }

    .numero,
    .porcentagem{
        font-size:42px;
    }
}
</style>
</head>

<body>

<h1>📦 Dashboard de Ocupação - CD Guarapari</h1>

<div class="upload">
    <h3>Importar Arquivo TSV</h3>
    <input type="file" id="arquivo" accept=".tsv,.txt">
</div>

<div id="dashboard-area">
    <div id="resultado"></div>
</div>

<div class="acoes">
    <button class="btn png" onclick="exportarPNG()">📸 Exportar PNG</button>
    <button class="btn whatsapp" onclick="enviarWhatsApp()">📱 WhatsApp</button>
</div>

<script>

document.getElementById("arquivo").addEventListener("change", function(e){

    const arquivo = e.target.files[0];
    const leitor = new FileReader();

    leitor.onload = function(){

        const linhas = leitor.result.trim().split("\n");
        const cabecalho = linhas[0].split("\t");

        const idxAndar = cabecalho.indexOf("Andar");
        const idxEstoque = cabecalho.indexOf("Estoque");
        const idxAtivo = cabecalho.indexOf("Ativo");

        let dados = {
            1:{total:0,ocupadas:0},
            2:{total:0,ocupadas:0},
            3:{total:0,ocupadas:0}
        };

        let totalGeral = 0;
        let ocupadasGeral = 0;

        for(let i=1;i<linhas.length;i++){

            const colunas = linhas[i].split("\t");

            if(colunas.length < cabecalho.length) continue;

            const ativo = colunas[idxAtivo]?.trim();
            const estoque = parseInt(colunas[idxEstoque]);
            const andar = parseInt(colunas[idxAndar]);

            if(ativo !== "S") continue;

            if(dados[andar]){

                dados[andar].total++;
                totalGeral++;

                if(estoque === 1){
                    dados[andar].ocupadas++;
                    ocupadasGeral++;
                }
            }
        }

        const livresGeral = totalGeral - ocupadasGeral;

        const taxa = totalGeral > 0
            ? ((ocupadasGeral / totalGeral) * 100).toFixed(1)
            : 0;

        let html = '<div class="cards">';

        [1,2,3].forEach(andar => {

            const total = dados[andar].total;
            const ocupadas = dados[andar].ocupadas;
            const livres = total - ocupadas;

            html += `
            <div class="card">
                <h2>🏢 Andar ${andar}</h2>
                <p>Total de vagas: <b>${total}</b></p>
                <p>🔴 Ocupadas: <b>${ocupadas}</b></p>
                <p>🟢 Disponíveis: <b>${livres}</b></p>
            </div>
            `;
        });

        html += `
            <div class="card total">
                <h2>Total Geral</h2>
                <div class="numero">${totalGeral}</div>
            </div>

            <div class="card ocupadas">
                <h2>Ocupadas</h2>
                <div class="numero">${ocupadasGeral}</div>
            </div>

            <div class="card livres">
                <h2>Disponíveis</h2>
                <div class="numero">${livresGeral}</div>
            </div>

            <div class="card taxa">
                <h2>Taxa de Ocupação</h2>
                <div class="porcentagem">${taxa}%</div>
            </div>
        `;

        html += '</div>';

        document.getElementById("resultado").innerHTML = html;
    };

    leitor.readAsText(arquivo);
});

function exportarPNG(){
    html2canvas(document.getElementById("dashboard-area"),{
        scale:2
    }).then(canvas => {

        const link = document.createElement("a");

        link.download = "dashboard.png";
        link.href = canvas.toDataURL("image/png");
        link.click();
    });
}

function enviarWhatsApp(){
    window.open(
        "https://wa.me/?text=" +
        encodeURIComponent("Dashboard de Ocupação CD Guarapari gerado com sucesso."),
        "_blank"
    );
}

</script>

</body>
</html>
